exclude: '(^|/)(build|\.venv|generated|data)/'
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: black
        name: black (check)
        entry: black --check --diff
        language: system
        types: [python]
      - id: isort
        name: isort (check)
        entry: isort --check-only
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
      - id: ruff
        name: ruff (check)
        entry: ruff check --no-fix
        language: system
        types: [python]
